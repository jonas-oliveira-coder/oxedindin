# Exemplo de produção para o Coolify.
# Backend e frontend são puxados do GHCR (imagens públicas).
# PostgreSQL e Redis usam as imagens oficiais.
#
# Passos no Coolify:
# 1. Crie um recurso "Docker Compose" (Empty ou via Git) e use este arquivo.
# 2. No serviço `frontend`, defina um domínio no campo "Domains"
#    (ex.: https://app.exemplo.com — sem porta, o nginx escuta na 80).
# 3. Deploy. Coolify gera os segredos (SERVICE_PASSWORD_*) e deriva as URLs
#    do backend a partir do domínio do frontend automaticamente.

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oxedindin}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-oxedindin_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oxedindin} -d ${POSTGRES_DB:-oxedindin_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/jonas-oliveira-coder/oxedindin-backend:latest
    pull_policy: always
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-oxedindin}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-oxedindin_prod}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${SERVICE_PASSWORD_JWT}
      JWT_REFRESH_SECRET: ${SERVICE_PASSWORD_JWT_REFRESH}
      COOKIE_SECRET: ${SERVICE_PASSWORD_COOKIE}
      CORS_ORIGIN: ${SERVICE_URL_FRONTEND}
      API_URL: ${SERVICE_URL_FRONTEND}
      FRONTEND_URL: ${SERVICE_URL_FRONTEND}
      WEB_AUTHN_RP_ID: ${SERVICE_FQDN_FRONTEND}
      WEB_AUTHN_RP_NAME: ${WEB_AUTHN_RP_NAME:-OxeDinDin}
      WEB_AUTHN_ORIGIN: ${SERVICE_URL_FRONTEND}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/jonas-oliveira-coder/oxedindin-frontend:latest
    pull_policy: always
    restart: always
    expose:
      - "80"
    depends_on:
      - backend

volumes:
  postgres_prod_data:
  redis_prod_data: