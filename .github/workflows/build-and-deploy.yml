name: Build and Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/oxedindin-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/oxedindin-frontend

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Run backend tests
        run: npm test --workspace=@oxedindin/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oxedindin_test
          JWT_SECRET: test-secret-key-min-32-chars-long
          JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars
          COOKIE_SECRET: test-cookie-secret-min-32-chars-long
          CORS_ORIGIN: http://localhost:5173
          WEB_AUTHN_RP_ID: localhost
          WEB_AUTHN_RP_NAME: OxeDinDin
          WEB_AUTHN_ORIGIN: http://localhost:5173
          FRONTEND_URL: http://localhost:5173
          API_URL: http://localhost:3000
          NODE_ENV: test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Run frontend unit tests
        run: npm test --workspace=@oxedindin/frontend

      - name: Run shared tests
        run: npm test --workspace=@oxedindin/shared

  build:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3000

  build-and-push:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Restart Coolify service
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          SERVICE_UUID: ${{ secrets.SERVICE_UUID }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$SERVICE_UUID" ]; then
            echo "COOLIFY_URL, COOLIFY_TOKEN or SERVICE_UUID not set; skipping Coolify API restart"
            exit 0
          fi

          echo "Restarting Coolify service..."
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --header "Accept: application/json" \
            "$COOLIFY_URL/api/v1/services/$SERVICE_UUID/restart?latest=true"
          echo
          echo "Coolify restart requested successfully."