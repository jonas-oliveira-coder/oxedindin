# Exemplo de deploy em produção no Coolify usando imagens publicadas no GHCR.
# Antes de usar:
# 1. Crie a rede externa `coolify` no servidor, caso ela ainda não exista.
# 2. Configure as variáveis abaixo no recurso do Coolify.
# 3. Configure o domínio do frontend e, se necessário, do backend na interface do Coolify.

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: tiamay_admin
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: tiamay_prod_db
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiamay_admin -d tiamay_prod_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_prod_data:/data
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/jonas-oliveira-coder/tiamay-reforco-backend:latest
    pull_policy: always
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      JWT_SECRET: ${SERVICE_PASSWORD_JWT}
      JWT_REFRESH_SECRET: ${SERVICE_PASSWORD_JWT_REFRESH}
      COOKIE_SECRET: ${SERVICE_PASSWORD_COOKIE}
      DATABASE_URL: postgresql://tiamay_admin:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/tiamay_prod_db
      REDIS_URL: redis://redis:6379
      API_URL: ${API_URL}
      CORS_ORIGIN: ${FRONTEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    expose:
      - "3000"
    networks:
      - coolify
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/jonas-oliveira-coder/tiamay-reforco-frontend:latest
    pull_policy: always
    restart: always
    expose:
      - "5173"
    networks:
      - coolify
    depends_on:
      - backend

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  coolify:
    external: true